<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" width="1260" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Andmete liikumine: veebileht → USB → ESP8266 plaadid</title>
  <defs>
    <style>
      text { fill: #1d1d1f; }
      .h1 { font-size: 24px; font-weight: 700; }
      .sub { font-size: 14px; fill: #55595f; }
      .lbl { font-size: 14px; font-weight: 700; }
      .blbl { font-size: 13px; font-weight: 700; fill: #4a5a7a; }
      .txt { font-size: 12.5px; fill: #3a3d42; }
      .small { font-size: 11.5px; fill: #55595f; }
      .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
      .m11 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #3a3d42; }
      .m12 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #3a3d42; }
      .assign { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #5b7fae; }
      .out { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0b62c4; }
      .in { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #b45309; }
      .digit { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #0b62c4; }
      .box { fill: #ffffff; stroke: #a9b4c8; stroke-width: 1.5; }
      .ext { fill: #f3f4f6; stroke: #c4c8cf; stroke-width: 1.5; }
      .hw { fill: #f1f8f3; stroke: #8fc19c; stroke-width: 1.5; }
      .note { fill: #f6f7f9; }
      .browser { fill: #f7f9fd; stroke: #8e9bb5; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .arrow { fill: none; stroke: #4a5568; stroke-width: 2; }
      .back { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 7 5; }
      .head { fill: #1c1c1e; }
      .off { fill: #3a3a3c; }
    </style>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="vastus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1260" height="760" rx="16" fill="#ffffff"/>

  <text x="40" y="48" class="h1">Andmete liikumine</text>
  <text x="40" y="74" class="sub">Leht arvutab kõigi fooride olekud ja saadab igale ESP8266-le USB kaudu ainult tema foori tuled.</text>

  <path class="arrow" d="M1000 40 H1040" marker-end="url(#nool)"/>
  <text x="1050" y="44" class="small">andmed</text>
  <path class="back" d="M1040 62 H1000" marker-end="url(#vastus)"/>
  <text x="1050" y="66" class="small">vastus plaadilt</text>

  <rect x="470" y="100" width="330" height="60" rx="12" class="ext"/>
  <text x="490" y="125" class="lbl">Kasutaja</text>
  <text x="490" y="145" class="txt">valib režiimi ja iga plaadi foori</text>

  <rect x="40" y="236" width="220" height="92" rx="12" class="ext"/>
  <text x="58" y="262" class="lbl">Ajaserver</text>
  <text x="58" y="282" class="m11">cloudflare.com/cdn-cgi/trace</text>
  <text x="58" y="301" class="small">varu: time.now</text>
  <text x="58" y="318" class="small">internet puudub → arvuti kell</text>
  <rect x="40" y="340" width="220" height="34" rx="8" fill="#fdf3e7" stroke="#f0c48a"/>
  <text x="56" y="362" class="in" style="font-size:12.5px">ts=1794916800.123</text>
  <text x="40" y="394" class="small">vastuse rida: Unix-aeg sekundites,</text>
  <text x="40" y="410" class="small">küsitakse lehe avamisel</text>

  <rect x="40" y="432" width="230" height="270" rx="12" fill="#f4f8fe" stroke="#b9cbe6"/>
  <text x="56" y="456" class="lbl">Pakett TULED:11010</text>
  <text x="56" y="474" class="small">üks tekstirida, 12 baiti</text>
  <text x="58" y="505" class="digit">1</text>
  <circle cx="82" cy="500" r="6" fill="#ff453a"/>
  <text x="96" y="505" class="txt">autode punane</text>
  <text x="58" y="527" class="digit">1</text>
  <circle cx="82" cy="522" r="6" fill="#ffd60a"/>
  <text x="96" y="527" class="txt">autode kollane</text>
  <text x="58" y="549" class="digit">0</text>
  <circle cx="82" cy="544" r="6" fill="#d1d5db"/>
  <text x="96" y="549" class="txt">autode roheline</text>
  <text x="58" y="571" class="digit">1</text>
  <circle cx="82" cy="566" r="6" fill="#ff453a"/>
  <text x="96" y="571" class="txt">jalakäijate punane</text>
  <text x="58" y="593" class="digit">0</text>
  <circle cx="82" cy="588" r="6" fill="#d1d5db"/>
  <text x="96" y="593" class="txt">jalakäijate roheline</text>
  <text x="56" y="618" class="small">0 kustus · 1 põleb · 2 vilgub</text>
  <text x="56" y="644" class="small">baidid (hex):</text>
  <text x="56" y="662" class="m11">54 55 4C 45 44 3A 31 31</text>
  <text x="56" y="678" class="m11">30 31 30 0A</text>
  <text x="140" y="678" class="small">(0A = reavahetus)</text>

  <rect x="300" y="186" width="590" height="540" rx="18" class="browser"/>
  <text x="318" y="210" class="blbl">Brauser · index.html</text>

  <rect x="330" y="236" width="230" height="92" rx="12" class="box"/>
  <text x="348" y="262" class="lbl">Kell ja režiim</text>
  <text x="348" y="280" class="file">js/app.js</text>
  <text x="348" y="300" class="txt">automaatne: kellaaja järgi</text>
  <text x="348" y="318" class="txt">või käsitsi valitud</text>

  <rect x="330" y="392" width="230" height="156" rx="12" class="box"/>
  <text x="348" y="418" class="lbl">Fooride juhtloogika</text>
  <text x="348" y="436" class="file">js/controller.js</text>
  <text x="348" y="460" class="txt">faasid A → B → C, vahetused,</text>
  <text x="348" y="478" class="txt">öörežiim; iga 50 ms kõigi</text>
  <text x="348" y="496" class="txt">17 foori olek, näiteks:</text>
  <text x="348" y="518" class="m11">{ F3:"110", F5:"100", …</text>
  <text x="348" y="535" class="m11">  Ü8:"10",  Ü2:"01",  … }</text>

  <rect x="330" y="612" width="230" height="92" rx="12" class="box"/>
  <text x="348" y="638" class="lbl">Ristmiku andmed</text>
  <text x="348" y="656" class="file">js/junction.js</text>
  <text x="348" y="676" class="txt">foorid, ülekäigud, vastuolud,</text>
  <text x="348" y="694" class="txt">faasid, režiimid, ajakava</text>

  <rect x="640" y="236" width="230" height="284" rx="12" class="box"/>
  <text x="658" y="262" class="lbl">Seadmehaldur</text>
  <text x="658" y="280" class="file">js/devices.js</text>
  <text x="658" y="306" class="txt">igale plaadile oma rida:</text>
  <text x="658" y="326" class="m11">"TULED:" + auto + jk</text>
  <text x="658" y="350" class="txt">muutus kohe, muidu sama</text>
  <text x="658" y="368" class="txt">rida iga 1 s uuesti</text>
  <line x1="658" y1="384" x2="852" y2="384" stroke="#e1e5ee"/>
  <text x="658" y="406" class="small">Ühendatud plaadid:</text>
  <text x="658" y="428" class="m12">Seade 1 → F3 · Ü8</text>
  <text x="658" y="448" class="m12">Seade 2 → F5 · Ü2</text>
  <text x="658" y="476" class="small">Web Serial API</text>
  <text x="658" y="494" class="small">115200 baudi, 8N1</text>

  <rect x="640" y="560" width="230" height="90" rx="12" class="box"/>
  <text x="658" y="586" class="lbl">Ekraan</text>
  <text x="658" y="604" class="file">js/map.js · js/timeline.js</text>
  <text x="658" y="626" class="txt">kaart, ajajoon, nimekirjad,</text>
  <text x="658" y="644" class="txt">side logi</text>

  <path class="arrow" d="M260 282 H330" marker-end="url(#nool)"/>
  <text x="295" y="273" text-anchor="middle" class="small">HTTPS</text>
  <path class="arrow" d="M540 160 V236" marker-end="url(#nool)"/>
  <text x="548" y="205" class="small">režiiminupp</text>
  <path class="arrow" d="M760 160 V236" marker-end="url(#nool)"/>
  <text x="768" y="205" class="small">foori valik plaadile</text>
  <path class="arrow" d="M445 328 V392" marker-end="url(#nool)"/>
  <text x="453" y="364" class="small">režiim, nt päev</text>
  <path class="arrow" d="M445 612 V548" marker-end="url(#nool)"/>
  <text x="453" y="586" class="small">ristmiku kirjeldus</text>
  <path class="arrow" d="M560 470 H612"/>
  <path class="arrow" d="M612 470 V336 H640" marker-end="url(#nool)"/>
  <path class="arrow" d="M612 470 V600 H640" marker-end="url(#nool)"/>
  <circle cx="612" cy="470" r="4" fill="#4a5568"/>
  <text x="586" y="462" text-anchor="middle" class="small">olekud</text>
  <path class="arrow" d="M755 520 V560" marker-end="url(#nool)"/>
  <text x="763" y="544" class="small">logi, märgid kaardil</text>

  <text x="1130" y="226" text-anchor="middle" class="small">USB · 115200 baudi · tekstiread</text>

  <path class="arrow" d="M870 272 H1030" marker-end="url(#nool)"/>
  <text x="902" y="244" class="assign">MAARA:F3,U8</text>
  <text x="902" y="263" class="out">TULED:11010</text>
  <path class="back" d="M1030 330 H870" marker-end="url(#vastus)"/>
  <text x="902" y="348" class="in">OK TULED:11010</text>

  <path class="arrow" d="M870 446 H1030" marker-end="url(#nool)"/>
  <text x="902" y="418" class="assign">MAARA:F5,U2</text>
  <text x="902" y="437" class="out">TULED:10001</text>
  <path class="back" d="M1030 500 H870" marker-end="url(#vastus)"/>
  <text x="902" y="518" class="in">OK MAARA:F5,U2</text>

  <rect x="1030" y="236" width="200" height="156" rx="12" class="hw"/>
  <text x="1046" y="260" class="lbl">ESP8266 · Seade 1</text>
  <text x="1046" y="278" class="txt">näitab F3 ja Ü8</text>
  <rect x="1052" y="290" width="30" height="80" rx="9" class="head"/>
  <circle cx="1067" cy="304" r="9" fill="#ff453a"/>
  <circle cx="1067" cy="330" r="9" fill="#ffd60a"/>
  <circle cx="1067" cy="356" r="9" class="off"/>
  <rect x="1100" y="298" width="30" height="56" rx="9" class="head"/>
  <circle cx="1115" cy="313" r="9" fill="#ff453a"/>
  <circle cx="1115" cy="339" r="9" class="off"/>
  <text x="1067" y="384" text-anchor="middle" class="small">autod</text>
  <text x="1115" y="384" text-anchor="middle" class="small">jalakäijad</text>
  <text x="1158" y="318" class="small">sai:</text>
  <text x="1158" y="338" class="out">11010</text>

  <rect x="1030" y="410" width="200" height="156" rx="12" class="hw"/>
  <text x="1046" y="434" class="lbl">ESP8266 · Seade 2</text>
  <text x="1046" y="452" class="txt">näitab F5 ja Ü2</text>
  <rect x="1052" y="464" width="30" height="80" rx="9" class="head"/>
  <circle cx="1067" cy="478" r="9" fill="#ff453a"/>
  <circle cx="1067" cy="504" r="9" class="off"/>
  <circle cx="1067" cy="530" r="9" class="off"/>
  <rect x="1100" y="472" width="30" height="56" rx="9" class="head"/>
  <circle cx="1115" cy="487" r="9" class="off"/>
  <circle cx="1115" cy="513" r="9" fill="#30d158"/>
  <text x="1067" y="558" text-anchor="middle" class="small">autod</text>
  <text x="1115" y="558" text-anchor="middle" class="small">jalakäijad</text>
  <text x="1158" y="492" class="small">sai:</text>
  <text x="1158" y="512" class="out">10001</text>

  <rect x="1030" y="584" width="200" height="156" rx="12" class="note"/>
  <text x="1046" y="608" class="lbl">Mitu plaati</text>
  <text x="1046" y="628" class="small">Iga plaat on oma USB-pordis</text>
  <text x="1046" y="646" class="small">ja saab ainult oma foori</text>
  <text x="1046" y="664" class="small">tuled. Plaat jätab oma foori</text>
  <text x="1046" y="682" class="small">meelde (KES? → SEADE:…).</text>
  <text x="1046" y="706" class="small">5 s vaikust → RIKE, autodele</text>
  <text x="1046" y="724" class="small">vilkuv kollane</text>
</svg>
