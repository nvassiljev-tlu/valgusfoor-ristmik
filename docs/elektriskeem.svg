  <text x="212" y="200" class="lbl">D2</text>
  <text x="252" y="200" class="txt">4</text>
  <circle cx="47" cy="220" r="5.5" fill="#e5484d"/>
  <text x="60" y="224" class="txt">Autode punane</text>
  <text x="212" y="224" class="lbl">D3</text>
  <text x="252" y="224" class="txt">0</text>
