  <text x="212" y="248" class="lbl">D4</text>
  <text x="252" y="248" class="txt">2</text>
  <use href="#hoiatus" x="266" y="238" width="12" height="11"/>
  <circle cx="47" cy="268" r="5.5" fill="#2f9e5e"/>
