  <rect width="1120" height="760" rx="16" fill="#ffffff"/>

  <text x="40" y="48" class="h1">Elektriskeem: üks füüsiline foor</text>
  <text x="40" y="74" class="sub">ESP8266 arendusplaat NodeMCU 1.0 (ESP-12E) · 5 LED-i · 5 takistit 220 Ω · toide ja andmed sama USB-kaabliga</text>

  <text x="40" y="122" class="lbl">Ühendused</text>
  <text x="40" y="146" class="small">Tuli</text>
  <text x="212" y="146" class="small">Viik</text>
  <text x="252" y="146" class="small">GPIO</text>
