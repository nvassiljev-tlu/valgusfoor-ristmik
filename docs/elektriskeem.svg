  <text x="212" y="272" class="lbl">D5</text>
  <text x="252" y="272" class="txt">14</text>
  <circle cx="47" cy="292" r="5.5" fill="#26282c"/>
  <text x="60" y="296" class="txt">Kõigi LED-ide miinus</text>
  <text x="212" y="296" class="lbl">GND</text>
  <text x="252" y="296" class="txt">–</text>

  <text x="40" y="350" class="lbl">Mitu füüsilist foori</text>
  <text x="40" y="372" class="txt">Iga foor on eraldi plaat sama skeemi ja</text>
  <text x="40" y="390" class="txt">sama püsivaraga, igaüks oma USB-pordis.</text>
  <text x="40" y="408" class="txt">Millist foori plaat näitab, valitakse</text>
  <text x="40" y="426" class="txt">veebilehel.</text>

