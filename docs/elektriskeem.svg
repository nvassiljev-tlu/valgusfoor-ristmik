  <text x="160" y="600" text-anchor="middle" class="lbl">Arvuti</text>
  <text x="160" y="618" text-anchor="middle" class="small">Chrome või Edge</text>
  <path d="M420 666 V704 H274 V566 H252" fill="none" stroke="#7a7f87" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="347" y="728" text-anchor="middle" class="small">USB-andmekaabel: 5 V toide + andmed 115200 baudi</text>

  <rect x="540" y="598" width="548" height="140" rx="12" fill="#fff8e6" stroke="#f0c36d"/>
  <text x="558" y="622" class="lbl">Meeldejätmiseks</text>
  <text x="558" y="646" class="txt">• Viik HIGH → LED põleb. 220 Ω hoiab voolu ≈ 6 mA (viik talub 12 mA).</text>
  <text x="558" y="668" class="txt">• LED-i pikk jalg (+) läheb takisti poole, lühike jalg (–) GND poole.</text>
  <text x="558" y="690" class="txt">• D3 ja D4 peavad plaadi käivitumisel olema HIGH. Kui plaat ei käivitu,</text>
  <text x="570" y="708" class="txt">tõsta autode punane D7-le ja kollane D6-le ning muuda sketšis kaks rida</text>
  <text x="570" y="726" class="txt">(vt docs/elektriskeem.md).</text>
